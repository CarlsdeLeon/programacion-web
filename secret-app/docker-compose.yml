version: "3.8"
services:
  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  backend:
    build: ./backend
    container_name: secret-backend
    depends_on:
      - redis
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - DEBUG=True
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    command: >
      sh -c "pip install -r requirements.txt &&
             python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"

  frontend:
    build: ./frontend
    container_name: secret-frontend
    depends_on:
      - backend
    ports:
      - "5173:80"  
    environment:
      - VITE_API_BASE=http://localhost:8000

  redisinsight:
    image: redis/redisinsight:latest  
    container_name: redisinsight
    ports:
      - "8001:8001"
    volumes:
      - redisinsight-data:/db
    environment:
      - RI_HOST=0.0.0.0

volumes:
  redis-data:
  redisinsight-data:  